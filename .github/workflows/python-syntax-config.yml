name: Python syntax / config validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-config:
    name: Python syntax / config validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compile tracked Python source without executing it
        shell: python -I {0}
        run: |
          import os
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files", "-z", "--", "*.py"])
          paths = [os.fsdecode(path) for path in tracked.split(b"\0") if path]
          if not paths:
              raise SystemExit("No tracked Python source files found.")
          for path in paths:
              compile(Path(path).read_bytes(), path, "exec", dont_inherit=True)
          print(f"Syntax valid: {len(paths)} tracked Python files.")
      - name: Parse application JSON configuration
        shell: python -I {0}
        run: |
          import json
          from pathlib import Path

          def reject_constant(value):
              raise ValueError(f"Invalid JSON constant: {value}")

          paths = ["config/config.json"]
          for path in paths:
              json.loads(Path(path).read_bytes(), parse_constant=reject_constant)
              print(f"JSON syntax valid: {path}")
